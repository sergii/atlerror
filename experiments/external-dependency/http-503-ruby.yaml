id: experiment.external_dependency.service_error.ruby_http
kind: experiment
title: Reachable downstream HTTP 503 surfaces as dependency service error
claims:
  - claim.external_dependency.service_error.http_503_surfaces_upstream_failure
description: Run an application service that synchronously calls a reachable downstream HTTP dependency. Keep the dependency health and transport path available while changing only the work response from HTTP 200 to HTTP 503, then restore HTTP 200 and capture both dependency and upstream outcomes.
runner:
  type: docker_compose
  compose_file: lab/external-dependency-error/compose.yml
  setup_service: app
  evidence_service: probe
expected_result: supports
limitations:
  - Both services are synthetic Ruby processes on one Docker host.
  - The experiment validates an explicit HTTP 503 service-level failure, not the provider-internal reason for producing that status.
