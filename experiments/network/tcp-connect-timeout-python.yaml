id: experiment.network.connection_timeout.python_linux
kind: experiment
title: Linux TCP connect timeout under silent packet drop
claims:
  - claim.network.connection_timeout.dropped_syn_expires_connect_deadline
description: Run a target container that answers normally on control port 9000 while Linux netfilter silently drops inbound TCP establishment traffic for port 9001. Baseline connects to the same target on port 9000 and receives pong. During intervention, the client attempts port 9001 with a short explicit connect timeout and must remain unestablished until the deadline expires without ECONNREFUSED. Recovery repeats the normal control connection to port 9000.
runner:
  type: docker_compose
  compose_file: lab/network-connection-timeout/compose.yml
  setup_service: server
  evidence_service: probe
expected_result: supports
limitations:
  - Uses NET_ADMIN inside the controlled target container only to install a netfilter DROP rule for deterministic reproduction.
  - Validates one Linux/Docker connect-timeout mechanism, not every production network timeout.
  - Does not cover read or request timeouts after TCP establishment.
