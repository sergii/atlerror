id: experiment.network.packet_duplication.netem_python_linux
kind: experiment
title: UDP packet duplication under controlled Linux netem intervention
claims:
  - claim.network.packet_duplication.netem_duplicate_repeats_udp_identity_without_loss
description: Send repeated bursts of uniquely sequenced UDP echo probes against a stable target, record baseline copy counts, apply Linux tc netem duplication on the probe container egress path, repeat the bursts, then remove the qdisc and measure recovery. Support the duplication claim only when repeated copies rise materially during intervention while every unique identity remains delivered and duplicate delivery returns to baseline after recovery.
runner:
  type: docker_compose
  compose_file: lab/network-packet-duplication/compose.yml
  setup_service: server
  evidence_service: probe
expected_result: supports
limitations:
  - Uses synthetic Linux netem duplication inside Docker rather than a physical production path.
  - Uses UDP bursts to expose duplicate datagrams directly and does not model TCP duplicate-segment suppression or congestion-control behavior.
  - Assertions target duplicate identity counts and complete unique delivery rather than an exact copy ratio.
