id: experiment.network.tls_client_certificate_wrong_ca.python_linux
kind: experiment
title: mTLS rejection of a client certificate signed by the wrong CA
claims:
  - claim.network.tls_client_certificate_authentication_failure.wrong_ca_client_cert_rejected
description: Run a TLS 1.3 peer with a server certificate signed by a trusted lab CA and require client certificates from that same CA. Baseline and recovery clients present a valid client certificate signed by the trusted CA. The intervention presents an otherwise valid clientAuth certificate signed by a separate rogue lab CA, so TCP and normal TLS negotiation proceed but the server rejects client authentication and protected application traffic cannot be used.
runner:
  type: docker_compose
  compose_file: lab/network-mtls-client-certificate/compose-wrong-ca.yml
  setup_service: tls
  evidence_service: probe
expected_result: supports
limitations:
  - Validates one wrong-trust-anchor client-certificate failure in Python/OpenSSL/Linux.
  - Does not cover expired, revoked, wrong-EKU, malformed, or application-authorization failures.
  - Does not establish production frequency or all possible TLS alert surfaces.
