id: experiment.network.tls_client_certificate_authentication.python_linux
kind: experiment
title: mTLS failure when a required client certificate is missing
claims:
  - claim.network.tls_client_certificate_authentication_failure.missing_client_cert_blocks_mtls
description: Run a TLS 1.3 peer with a server certificate signed by a lab CA and require client certificates from the same CA. Baseline and recovery clients present a valid client certificate and exchange application data. The intervention uses the same trusted server, TLS version, and endpoint but omits the client certificate, so TCP succeeds while mutual-TLS client authentication fails before protected application traffic can proceed.
runner:
  type: docker_compose
  compose_file: lab/network-mtls-client-certificate/compose.yml
  setup_service: tls
  evidence_service: probe
expected_result: supports
limitations:
  - Validates missing required client-certificate behavior in one Python/OpenSSL/Linux environment.
  - Does not cover expired, revoked, untrusted, wrong-EKU, or wrong-identity client certificates.
  - Does not establish production frequency or application-layer authorization behavior after successful mTLS.
