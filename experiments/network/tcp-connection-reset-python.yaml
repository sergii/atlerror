id: experiment.network.connection_reset.python_linux
kind: experiment
title: Linux TCP connection reset and recovery
claims:
  - claim.network.connection_reset.peer_rst_surfaces_econnreset
description: Run a small TCP peer in Docker. Baseline sends a normal command and receives a response. During intervention, the same reachable peer accepts the connection, receives a reset command, enables abortive close with SO_LINGER(1,0), and closes so Linux emits a TCP RST. The client must observe ECONNRESET. Recovery repeats the normal command and must succeed again.
runner:
  type: docker_compose
  compose_file: lab/network-connection-reset/compose.yml
  setup_service: server
  evidence_service: probe
expected_result: supports
limitations:
  - Validates a Linux TCP reset generated by an abortive peer close in Docker on one host.
  - Does not reproduce every source of RST packets or every client/runtime error mapping.
  - Does not cover refusal, connect timeout, DNS, TLS, packet loss, or application-protocol errors.
