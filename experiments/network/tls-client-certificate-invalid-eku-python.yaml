id: experiment.network.tls_client_certificate_invalid_eku.python_linux
kind: experiment
title: mTLS rejection of a trusted client certificate with invalid EKU
claims:
  - claim.network.tls_client_certificate_authentication_failure.invalid_client_eku_rejected
description: Run a TLS 1.3 peer with a server certificate signed by a trusted lab CA and require client certificates from that same CA. Baseline and recovery clients present a valid clientAuth certificate. The intervention presents a certificate signed by the same trusted CA but carrying serverAuth instead of clientAuth Extended Key Usage, so issuer trust, TCP, TLS version, server identity, and certificate presence remain intact while the client credential is unsuitable for mTLS client authentication.
runner:
  type: docker_compose
  compose_file: lab/network-mtls-client-certificate/compose-invalid-eku.yml
  setup_service: tls
  evidence_service: probe
expected_result: supports
limitations:
  - Validates one trusted-issuer Extended Key Usage mismatch in Python/OpenSSL/Linux.
  - Uses serverAuth as the intentionally wrong EKU and does not cover every possible EKU or certificate-policy combination.
  - Does not establish production frequency or application-layer authorization behavior after successful mTLS.
