id: experiment.network.tls_protocol_negotiation.python_linux
kind: experiment
title: TLS protocol negotiation failure with disjoint version sets
claims:
  - claim.network.tls_protocol_negotiation_failure.no_common_version_blocks_handshake
description: Run a TLS peer restricted to TLS 1.2 with a certificate signed by a lab CA trusted by the client. Baseline connects with a TLS 1.2-only client and succeeds. Intervention uses a TLS 1.3-only client against the same peer and certificate, so TCP succeeds but TLS negotiation fails because no protocol version overlaps. Recovery returns to TLS 1.2 and succeeds again.
runner:
  type: docker_compose
  compose_file: lab/network-tls-protocol-negotiation/compose.yml
  setup_service: tls
  evidence_service: probe
expected_result: supports
limitations:
  - Validates protocol-version incompatibility, not every TLS negotiation failure.
  - Does not cover cipher-suite mismatch, signature algorithms, ALPN, SNI policy, mTLS, or certificate verification failures.
  - TLS error strings can vary across OpenSSL/runtime versions; the controlled version constraints and lifecycle outcome are the primary evidence.
