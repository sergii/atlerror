id: experiment.network.tls_cipher_negotiation.python_linux
kind: experiment
title: TLS cipher-suite negotiation failure with disjoint TLS 1.2 cipher sets
claims:
  - claim.network.tls_cipher_negotiation_failure.no_common_cipher_blocks_handshake
description: Run a TLS 1.2-only peer with a certificate signed by a lab CA trusted by the client. Baseline connects with a TLS 1.2-only client whose cipher list overlaps the server and succeeds. Intervention uses the same TLS version and trust configuration but restricts the client to a cipher suite not permitted by the server, so TCP succeeds but TLS negotiation fails because no cipher overlaps. Recovery restores the shared cipher and succeeds again.
runner:
  type: docker_compose
  compose_file: lab/network-tls-cipher-negotiation/compose.yml
  setup_service: tls
  evidence_service: probe
expected_result: supports
limitations:
  - Validates one TLS 1.2 cipher-suite incompatibility, not every TLS negotiation failure.
  - Does not cover TLS 1.3 cipher configuration, protocol-version mismatch, signature algorithms, groups, ALPN, SNI policy, mTLS, or certificate verification failures.
  - TLS error strings can vary across OpenSSL/runtime versions; the controlled shared TLS version, disjoint cipher configuration, and lifecycle outcome are the primary evidence.
