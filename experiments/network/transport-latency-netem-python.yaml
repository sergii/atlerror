id: experiment.network.transport_latency.netem_python_linux
kind: experiment
title: Linux transport latency under deterministic netem delay
claims:
  - claim.network.transport_latency.netem_delay_increases_transport_timing
description: Run a small TCP target with stable server-side processing, measure baseline client connection and request exchange timing, add a fixed Linux tc netem delay to the probe container egress path, repeat the measurements, then remove the qdisc and measure recovery. The lab supports transport latency only when client-side timings rise materially while target processing time stays comparable.
runner:
  type: docker_compose
  compose_file: lab/network-transport-latency/compose.yml
  setup_service: server
  evidence_service: probe
expected_result: supports
limitations:
  - Uses NET_ADMIN only inside the controlled probe container to install and remove a deterministic netem qdisc.
  - Validates one Linux/Docker transport-delay mechanism rather than every cause of production network latency.
  - Does not cover packet loss, reordering, route changes, congestion, or asymmetric paths.
