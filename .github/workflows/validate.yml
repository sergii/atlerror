name: Validate semantic knowledge

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install validator dependencies
        run: python -m pip install --disable-pip-version-check PyYAML jsonschema

      - name: Validate schemas and references
        run: python scripts/validate.py

      - name: Validate diagnostic catalog codes
        run: python scripts/validate_catalog.py

      - name: Validate causal projections
        run: python scripts/test_causal_projection.py

      - name: Validate causal ranking
        run: python scripts/test_causal_ranking.py

      - name: Validate recommended next-probe ranking
        run: python scripts/test_probe_ranking.py

      - name: Validate runtime evidence
        run: python scripts/test_runtime_evidence.py

      - name: Validate runtime evidence composition
        run: python scripts/test_runtime_evidence_composition.py

      - name: Validate Prometheus adapter
        run: python scripts/test_prometheus_adapter.py

      - name: Validate OpenTelemetry trace adapter
        run: python scripts/test_opentelemetry_trace_adapter.py

      - name: Validate OTLP HTTP receiver
        run: python scripts/test_otlp_http_receiver.py

      - name: Validate live diagnosis loop
        run: python scripts/test_live_diagnosis.py

      - name: Validate live probe recommendations
        run: python scripts/test_live_probe_recommendations.py

      - name: Validate next-probe execution annotations
        run: python scripts/test_probe_execution_annotation.py

      - name: Validate agent plan projection
        run: python scripts/test_agent_plan.py

      - name: Validate agent plan workflow recovery
        run: python scripts/test_agent_plan_workflow_recovery.py

      - name: Validate MCP workflow reconciliation tool
        run: python scripts/test_mcp_probe_recovery_tool.py

      - name: Validate agent plan probe sessions
        run: python scripts/test_agent_plan_probe_sessions.py

      - name: Validate probe session lifecycle policy
        run: python scripts/test_probe_session_lifecycle.py

      - name: Validate probe workflow reconciliation
        run: python scripts/test_probe_workflow_reconciliation.py

      - name: Validate probe workflow history
        run: python scripts/test_probe_workflow_history.py

      - name: Validate append-only probe workflow journal
        run: python scripts/test_probe_workflow_journal.py

      - name: Validate cross-process probe claims
        run: python scripts/test_probe_filesystem_claim.py

      - name: Validate diagnosis HTTP API
        run: python scripts/test_diagnosis_http_api.py

      - name: Validate diagnosis MCP resources
        run: python scripts/test_diagnosis_mcp_server.py

      - name: Validate MCP probe capability resource
        run: python scripts/test_diagnosis_mcp_capabilities.py

      - name: Validate MCP read-only probe tools
        run: python scripts/test_diagnosis_mcp_probe_tools.py

      - name: Validate end-to-end demo harness
        run: python scripts/test_demo_checkout_stripe.py

      - name: Validate probe executor registry
        run: python scripts/test_probe_executor_registry.py

      - name: Validate safe read-only probe execution
        run: python scripts/test_probe_execution.py
