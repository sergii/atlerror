name: Apply Q2.2 projection migration

on:
  push:
    branches: [feat/q2-2-ack-before-durable-effect]
    paths:
      - ".github/workflows/q22-projection-migration.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply guarded projection edits
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f"anchor not found in {path}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "vocabulary/diagnostic-catalog.yaml",
              """  - code: S11
    kind: symptom
    title: Duplicate message delivery observed
    canonical_id: symptom.messaging.duplicate_delivery_observed
    routes_to: [Q2.1]

  - code: R1.1
""",
              """  - code: S11
    kind: symptom
    title: Duplicate message delivery observed
    canonical_id: symptom.messaging.duplicate_delivery_observed
    routes_to: [Q2.1]

  - code: S12
    kind: symptom
    title: Expected asynchronous effect missing
    canonical_id: symptom.messaging.expected_effect_missing
    routes_to: [Q2.2]

  - code: R1.1
""",
          )

          replace_once(
              "vocabulary/diagnostic-catalog.yaml",
              """  - code: Q2.1
    kind: mechanism
    title: Duplicate message delivery / redelivery
    canonical_id: hypothesis.messaging.duplicate_delivery
    symptoms: [S11]
    coverage: empirical
    claims:
      - claim.messaging.duplicate_delivery.unacked_message_is_redelivered
    experiments:
      - code: Q2.1-L1
        id: experiment.messaging.duplicate_delivery.redis_streams_python

  - code: E1.1
""",
              """  - code: Q2.1
    kind: mechanism
    title: Duplicate message delivery / redelivery
    canonical_id: hypothesis.messaging.duplicate_delivery
    symptoms: [S11]
    coverage: empirical
    claims:
      - claim.messaging.duplicate_delivery.unacked_message_is_redelivered
    experiments:
      - code: Q2.1-L1
        id: experiment.messaging.duplicate_delivery.redis_streams_python

  - code: Q2.2
    kind: mechanism
    title: Acknowledged before durable effect / effective message loss
    canonical_id: hypothesis.messaging.acknowledged_before_durable_effect
    symptoms: [S12]
    coverage: empirical
    claims:
      - claim.messaging.acknowledged_before_durable_effect.ack_suppresses_redelivery_before_effect
    experiments:
      - code: Q2.2-L1
        id: experiment.messaging.acknowledged_before_durable_effect.redis_streams_python

  - code: E1.1
""",
          )

          replace_once(
              "vocabulary/diagnostic-profiles.yaml",
              """  - code: Q2.1
    facets: {domains: [queue_messaging, application], concerns: [delivery, reliability, correctness], resources: [queue], layers: [messaging, application]}
    coverage: {semantic: complete, predictions: complete, falsification: complete, probes: complete, rules: complete, human_explanation: complete, agent_action: partial}
    empirical: {synthetic_labs: 1, runtimes: [python], production_evidence: none}
  - code: E1.1
""",
              """  - code: Q2.1
    facets: {domains: [queue_messaging, application], concerns: [delivery, reliability, correctness], resources: [queue], layers: [messaging, application]}
    coverage: {semantic: complete, predictions: complete, falsification: complete, probes: complete, rules: complete, human_explanation: complete, agent_action: partial}
    empirical: {synthetic_labs: 1, runtimes: [python], production_evidence: none}
  - code: Q2.2
    facets: {domains: [queue_messaging, application], concerns: [delivery, reliability, correctness], resources: [queue], layers: [messaging, application]}
    coverage: {semantic: complete, predictions: complete, falsification: complete, probes: complete, rules: complete, human_explanation: complete, agent_action: partial}
    empirical: {synthetic_labs: 1, runtimes: [python], production_evidence: none}
  - code: E1.1
""",
          )

          replace_once(
              ".github/workflows/lab.yml",
              """          - name: messaging-duplicate-delivery-redis-streams-python
            manifest: experiments/messaging/duplicate-delivery-redis-streams-python.yaml
            result: experiment.messaging.duplicate_delivery.redis_streams_python.json
          - name: latency-database-python-postgres
""",
              """          - name: messaging-duplicate-delivery-redis-streams-python
            manifest: experiments/messaging/duplicate-delivery-redis-streams-python.yaml
            result: experiment.messaging.duplicate_delivery.redis_streams_python.json
          - name: messaging-ack-before-durable-effect-redis-streams-python
            manifest: experiments/messaging/ack-before-durable-effect-redis-streams-python.yaml
            result: experiment.messaging.acknowledged_before_durable_effect.redis_streams_python.json
          - name: latency-database-python-postgres
""",
          )
      - name: Commit projection edits
        run: |
          git config user.name "atlerror-ci"
          git config user.email "atlerror-ci@users.noreply.github.com"
          git add vocabulary/diagnostic-catalog.yaml vocabulary/diagnostic-profiles.yaml .github/workflows/lab.yml
          if git diff --cached --quiet; then
            echo "No projection changes needed"
          else
            git commit -m "Wire Q2.2 into catalog and empirical matrix"
            git push
          fi
