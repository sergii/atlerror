name: Run empirical labs

on:
  push:
    branches: [main]
    paths:
      - "lab/**"
      - "experiments/**"
      - "schema/experiment.schema.json"
      - "schema/empirical-evidence.schema.json"
      - "scripts/run_lab.py"
      - "scripts/select_labs.py"
      - ".github/workflows/lab.yml"
  pull_request:
    paths:
      - "lab/**"
      - "experiments/**"
      - "schema/experiment.schema.json"
      - "schema/empirical-evidence.schema.json"
      - "scripts/run_lab.py"
      - "scripts/select_labs.py"
      - ".github/workflows/lab.yml"

concurrency:
  group: empirical-labs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  select:
    name: Select changed labs
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      has_labs: ${{ steps.select.outputs.has_labs }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install selector dependencies
        run: python -m pip install --disable-pip-version-check PyYAML
      - name: Select affected empirical labs
        id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          matrix="$(python scripts/select_labs.py --base "$BASE_SHA" --head "$HEAD_SHA")"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

          if [ "$matrix" = '{"include":[]}' ]; then
            echo "has_labs=false" >> "$GITHUB_OUTPUT"
            echo "No empirical labs are affected by this change." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "has_labs=true" >> "$GITHUB_OUTPUT"
            echo "Running only empirical labs affected by this change." >> "$GITHUB_STEP_SUMMARY"
          fi

  experiment:
    name: ${{ matrix.name }}
    needs: select
    if: needs.select.outputs.has_labs == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install lab runner dependencies
        run: python -m pip install --disable-pip-version-check PyYAML jsonschema
      - name: Run empirical experiment
        run: python scripts/run_lab.py "${{ matrix.manifest }}"
      - name: Upload empirical evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-evidence
          path: lab-results/${{ matrix.result }}
