name: Run empirical labs

on:
  push:
    branches: [main]
    paths:
      - "lab/**"
      - "claims/**"
      - "experiments/**"
      - "schema/**"
      - "scripts/run_lab.py"
      - "knowledge/**"
      - ".github/workflows/lab.yml"
  pull_request:
    paths:
      - "lab/**"
      - "claims/**"
      - "experiments/**"
      - "schema/**"
      - "scripts/run_lab.py"
      - "knowledge/**"
      - ".github/workflows/lab.yml"

jobs:
  experiment:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: memory-retention-ruby
            manifest: experiments/memory/retention-ruby.yaml
            result: experiment.memory.retention.ruby.json
          - name: cpu-busy-loop-ruby
            manifest: experiments/cpu/busy-loop-ruby.yaml
            result: experiment.cpu.busy_loop.ruby.json
          - name: traffic-increase-ruby-http
            manifest: experiments/cpu/traffic-increase-ruby-http.yaml
            result: experiment.traffic.increase.ruby_http.json
          - name: gc-pressure-ruby
            manifest: experiments/cpu/gc-pressure-ruby.yaml
            result: experiment.gc.pressure.ruby.json
          - name: kernel-work-ruby
            manifest: experiments/cpu/kernel-work-ruby.yaml
            result: experiment.kernel.work.ruby.json
          - name: latency-external-dependency-ruby-http
            manifest: experiments/latency/external-dependency-ruby-http.yaml
            result: experiment.latency.external_dependency.ruby_http.json
          - name: latency-database-python-postgres
            manifest: experiments/latency/database-query-delay-python-postgres.yaml
            result: experiment.latency.database.query_delay_python_postgres.json
          - name: latency-database-lock-wait-python-postgres
            manifest: experiments/latency/database-lock-wait-python-postgres.yaml
            result: experiment.latency.database.lock_wait_python_postgres.json
          - name: database-deadlock-python-postgres
            manifest: experiments/database/deadlock-python-postgres.yaml
            result: experiment.database.deadlock.python_postgres.json
          - name: database-serialization-failure-python-postgres
            manifest: experiments/database/serialization-failure-python-postgres.yaml
            result: experiment.database.serialization_failure.python_postgres.json
          - name: database-write-skew-python-postgres
            manifest: experiments/database/write-skew-python-postgres.yaml
            result: experiment.database.isolation_anomaly.write_skew_python_postgres.json
          - name: database-connection-pool-exhaustion-python-postgres
            manifest: experiments/database/connection-pool-exhaustion-python-postgres.yaml
            result: experiment.database.connection_pool_exhaustion.python_postgres.json
          - name: database-connection-admission-exhaustion-python-postgres
            manifest: experiments/database/connection-admission-exhaustion-python-postgres.yaml
            result: experiment.database.connection_admission_exhaustion.python_postgres.json
          - name: network-connection-reset-python-linux
            manifest: experiments/network/tcp-connection-reset-python.yaml
            result: experiment.network.connection_reset.python_linux.json
          - name: network-connection-refused-python-linux
            manifest: experiments/network/tcp-connection-refused-python.yaml
            result: experiment.network.connection_refused.python_linux.json
          - name: network-connect-timeout-python-linux
            manifest: experiments/network/tcp-connect-timeout-python.yaml
            result: experiment.network.connection_timeout.python_linux.json
          - name: network-dns-resolution-python-linux
            manifest: experiments/network/dns-resolution-failure-python.yaml
            result: experiment.network.dns_resolution_failure.python_linux.json
          - name: network-dns-resolver-timeout-python-linux
            manifest: experiments/network/dns-resolver-timeout-python.yaml
            result: experiment.network.dns_resolver_timeout.python_linux.json
          - name: network-tls-certificate-verification-python-linux
            manifest: experiments/network/tls-certificate-verification-python.yaml
            result: experiment.network.tls_certificate_verification.python_linux.json
          - name: network-tls-protocol-negotiation-python-linux
            manifest: experiments/network/tls-protocol-negotiation-python.yaml
            result: experiment.network.tls_protocol_negotiation.python_linux.json
          - name: network-tls-cipher-negotiation-python-linux
            manifest: experiments/network/tls-cipher-negotiation-python.yaml
            result: experiment.network.tls_cipher_negotiation.python_linux.json
          - name: network-mtls-client-certificate-python-linux
            manifest: experiments/network/tls-client-certificate-authentication-python.yaml
            result: experiment.network.tls_client_certificate_authentication.python_linux.json
          - name: network-mtls-wrong-ca-client-certificate-python-linux
            manifest: experiments/network/tls-client-certificate-wrong-ca-python.yaml
            result: experiment.network.tls_client_certificate_wrong_ca.python_linux.json

    name: ${{ matrix.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install lab runner dependencies
        run: python -m pip install --disable-pip-version-check PyYAML jsonschema
      - name: Run empirical experiment
        run: python scripts/run_lab.py "${{ matrix.manifest }}"
      - name: Upload empirical evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-evidence
          path: lab-results/${{ matrix.result }}
