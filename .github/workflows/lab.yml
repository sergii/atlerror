name: Run empirical labs

on:
  push:
    branches: [main]
    paths:
      - "lab/**"
      - "claims/**"
      - "experiments/**"
      - "schema/**"
      - "scripts/run_lab.py"
      - "knowledge/**"
      - ".github/workflows/lab.yml"
  pull_request:
    paths:
      - "lab/**"
      - "claims/**"
      - "experiments/**"
      - "schema/**"
      - "scripts/run_lab.py"
      - "knowledge/**"
      - ".github/workflows/lab.yml"

jobs:
  experiment:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: memory-retention-ruby
            manifest: experiments/memory/retention-ruby.yaml
            result: experiment.memory.retention.ruby.json
          - name: cpu-busy-loop-ruby
            manifest: experiments/cpu/busy-loop-ruby.yaml
            result: experiment.cpu.busy_loop.ruby.json
          - name: traffic-increase-ruby-http
            manifest: experiments/cpu/traffic-increase-ruby-http.yaml
            result: experiment.traffic.increase.ruby_http.json

    name: ${{ matrix.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install lab runner dependencies
        run: python -m pip install --disable-pip-version-check PyYAML jsonschema

      - name: Run empirical experiment
        run: python scripts/run_lab.py "${{ matrix.manifest }}"

      - name: Upload empirical evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-evidence
          path: lab-results/${{ matrix.result }}
