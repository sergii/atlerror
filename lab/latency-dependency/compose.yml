services:
  dependency:
    build: .
    command: ["ruby", "/lab/dependency.rb"]
    healthcheck:
      test: ["CMD", "ruby", "-rsocket", "-e", "TCPSocket.new('127.0.0.1', 9090).close"]
      interval: 1s
      timeout: 1s
      retries: 20
  app:
    build: .
    command: ["ruby", "/lab/app.rb"]
    environment:
      DEPENDENCY_HOST: dependency
      DEPENDENCY_PORT: "9090"
    depends_on:
      dependency:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "ruby", "-rsocket", "-e", "TCPSocket.new('127.0.0.1', 8080).close"]
      interval: 1s
      timeout: 1s
      retries: 20
  probe:
    build: .
    command: ["ruby", "/lab/probe.rb"]
    depends_on:
      app:
        condition: service_healthy
