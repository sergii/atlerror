services:
  db:
    image: postgres:17-alpine
    command:
      - postgres
      - -c
      - max_connections=8
      - -c
      - superuser_reserved_connections=2
    environment:
      POSTGRES_USER: atlerror_admin
      POSTGRES_PASSWORD: atlerror
      POSTGRES_DB: atlerror
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlerror_admin -d atlerror"]
      interval: 1s
      timeout: 1s
      retries: 30

  harness:
    build: .
    image: atlerror-database-connection-admission-lab
    command: ["sleep", "infinity"]
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: atlerror
      ADMIN_USER: atlerror_admin
      ADMIN_PASSWORD: atlerror
      APP_USER: atlerror_app
      APP_PASSWORD: atlerror_app
      MAX_ATTEMPTS: "20"
    depends_on:
      db:
        condition: service_healthy

  probe:
    image: atlerror-database-connection-admission-lab
    command: ["python", "/lab/probe.py"]
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: atlerror
      ADMIN_USER: atlerror_admin
      ADMIN_PASSWORD: atlerror
      APP_USER: atlerror_app
      APP_PASSWORD: atlerror_app
      MAX_ATTEMPTS: "20"
    depends_on:
      db:
        condition: service_healthy
