id: experiment.memory.retention.ruby
status: experimental

tests:
  - hypothesis.memory.retention

observations:
  - observation.memory.rss
  - observation.runtime.heap_live_objects

environment:
  runtime: ruby
  isolation: docker
  os_family: linux

intervention:
  action: retain_objects
  description: Allocate many Ruby strings and keep them strongly reachable through an array.

expected:
  - observation: observation.memory.rss
    condition: increases_materially
  - observation: observation.runtime.heap_live_objects
    condition: increases_materially_after_gc

recovery:
  action: release_references_and_collect
  expected:
    - observation.runtime.heap_live_objects returns toward baseline
    - observation.memory.rss may remain elevated because process RSS and managed-object reachability are not equivalent

limitations:
  - This experiment supports the retained-managed-objects mechanism; it does not prove that every high-RSS incident is a memory leak.
  - It does not model native allocations, mmap-backed memory, allocator fragmentation, page cache, or host-level reclaim pressure.
