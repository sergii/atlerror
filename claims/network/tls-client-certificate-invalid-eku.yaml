id: claim.network.tls_client_certificate_authentication_failure.invalid_client_eku_rejected
kind: claim
title: Client certificate without clientAuth EKU is rejected by an mTLS server
statement: When a reachable TLS 1.3 server requires client certificates from a trusted CA, a certificate signed by that trusted CA and valid for clientAuth permits protected application traffic while an otherwise valid certificate from the same trusted CA whose Extended Key Usage does not permit client authentication does not produce a usable mutual-TLS session.
hypothesis: hypothesis.network.tls_client_certificate_authentication_failure
predictions:
  - observation: observation.network.tls_client_certificate_authentication_error
    expected: tcp_and_tls_negotiation_reach_client_auth_but_trusted_client_certificate_with_invalid_eku_is_rejected
    strength: strong
system_entities:
  - system_entity.application_service
  - system_entity.external_dependency
boundaries:
  - boundary.application.external_dependency_tls
scope:
  runtime: python
  os: linux
limitations:
  - Validates one controlled TLS 1.3 Extended Key Usage mismatch using Python and OpenSSL.
  - The intervention certificate is signed by the same trusted CA and differs primarily by Extended Key Usage, using serverAuth instead of clientAuth.
  - Does not cover expiration, revocation, key-usage-only failures, malformed chains, certificate policy OIDs, client identity authorization, or every TLS implementation error surface.
