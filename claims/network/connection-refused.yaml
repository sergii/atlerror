id: claim.network.connection_refused.closed_port_surfaces_econnrefused
kind: claim
title: Closed TCP port surfaces as connection refused
statement: When a Linux client can reach a peer host but connects to a TCP port with no listening socket, connection establishment can fail promptly with ECONNREFUSED while a known listening port on the same peer remains reachable before and after the intervention.
hypothesis: hypothesis.network.connection_refused
predictions:
  - observation: observation.network.connection_refused
    expected: linux_client_reports_econnrefused_for_closed_port
    strength: strong
system_entities:
  - system_entity.application_service
  - system_entity.external_dependency
scope:
  runtime: python
  os: linux
limitations:
  - Validates one Linux same-peer closed-port refusal path in Docker.
  - Real refusals can be generated by destination hosts, local policy, proxies, firewalls, or service lifecycle behavior.
  - Does not cover connection reset after establishment, timeout, DNS, TLS, or application-protocol failures.
