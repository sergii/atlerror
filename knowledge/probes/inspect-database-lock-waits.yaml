id: probe.database.inspect_lock_waits
kind: probe
title: Inspect database lock waits
summary: Inspect database session and lock metadata to identify blocked operations, blockers, and time spent waiting for locks.
produces:
  - observation.database.lock_wait_time
  - observation.database.lock_wait_event
requires:
  - capability.database.inspect_locks
preferred_tools:
  - tool.postgresql
risk: read_only
