id: probe.network.inspect_tls_handshake
kind: probe
title: Inspect TLS handshake and certificate verification
summary: Establish controlled transport connectivity to an endpoint, attempt TLS negotiation with normal certificate verification, and capture verification errors and handshake outcome.
produces:
  - observation.network.tls_certificate_verification_error
requires:
  - capability.network.inspect_tls_handshake
preferred_tools:
  - tool.openssl
risk: low
