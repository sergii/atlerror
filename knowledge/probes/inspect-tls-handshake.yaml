id: probe.network.inspect_tls_handshake
kind: probe
title: Inspect TLS handshake
summary: Establish controlled transport connectivity to an endpoint, attempt TLS negotiation with normal verification, and capture certificate verification, protocol-version negotiation, cipher-suite negotiation, client-certificate authentication, negotiated TLS metadata, and handshake outcome.
produces:
  - observation.network.tls_certificate_verification_error
  - observation.network.tls_protocol_negotiation_error
  - observation.network.tls_cipher_negotiation_error
  - observation.network.tls_client_certificate_authentication_error
requires:
  - capability.network.inspect_tls_handshake
preferred_tools:
  - tool.openssl
risk: low
