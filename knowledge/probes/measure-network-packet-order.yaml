id: probe.network.measure_packet_order
kind: probe
title: Measure network packet arrival order
produces:
  - observation.network.packet_reordering
requires:
  - capability.network.measure_packet_order
method: Send a controlled burst of uniquely sequenced probe packets or datagrams across a stable boundary, record the receive sequence, and compare it with send order while independently accounting for missing or duplicate deliveries.
interpretation:
  supports: Repeated sequence inversions or transport reordering indicators rise materially above baseline while delivery can remain complete.
  weakens: Receive order remains consistent with send order across comparable bursts and no transport-level reordering signal is present.
