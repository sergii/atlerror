id: hypothesis.network.tls_protocol_negotiation_failure
kind: hypothesis
title: TLS protocol negotiation failure
summary: TCP connectivity succeeds, but client and server cannot agree on a mutually supported TLS protocol version, so the TLS session is not established even though certificate trust is not the failing mechanism.
predictions:
  - observation: observation.network.tls_protocol_negotiation_error
    expected: no_common_tls_protocol_version_after_tcp_establishment
    strength: strong
falsifiers:
  - observation: observation.network.tls_protocol_negotiation_error
    condition: absent_when_tls_handshake_fails
    effect: decrease
tested_by:
  - probe.network.inspect_tls_handshake
related_to:
  - symptom.network.tls_handshake_failed
  - symptom.database.connection_failed
  - hypothesis.network.tls_certificate_verification_failure
  - system_entity.application_service
  - system_entity.external_dependency
  - boundary.application.external_dependency_tls
common_misconceptions:
  - Every TLS handshake failure is a certificate problem; protocol negotiation can fail before a usable secure session exists even with a trusted certificate configuration.
  - Successful TCP establishment proves client and server share a usable TLS version; transport connectivity and TLS capability negotiation are separate lifecycle phases.
  - Disabling certificate verification repairs a protocol mismatch; trust verification is unrelated to whether the endpoints support a common TLS version.
search_terms:
  - TLS protocol version mismatch
  - TLS alert protocol version
  - unsupported protocol
  - no shared TLS version
  - SSL handshake failure protocol version
