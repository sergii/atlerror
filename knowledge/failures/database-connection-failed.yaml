id: symptom.database.connection_failed
kind: symptom
title: Database connection failed
summary: An application, worker, or diagnostic client could not establish a new database session or connection.
explanation:
  short: A new database connection attempt failed before normal query or transaction work could begin.
  detailed: Connection establishment can fail because the database rejects admission at a configured session limit, the network path resets or refuses the connection, connection establishment receives no response before its deadline, name resolution returns a negative result or times out, TLS certificate verification, protocol-version negotiation, cipher-suite negotiation, or required client-certificate authentication fails, credentials are invalid, or the database process is unavailable. Diagnose the concrete establishment error and lifecycle phase before assigning a mechanism.
may_indicate:
  - hypothesis.database.connection_admission_exhaustion
  - hypothesis.network.connection_reset
  - hypothesis.network.connection_refused
  - hypothesis.network.connection_timeout
  - hypothesis.network.dns_resolution_failure
  - hypothesis.network.dns_resolver_timeout
  - hypothesis.network.tls_certificate_verification_failure
  - hypothesis.network.tls_protocol_negotiation_failure
  - hypothesis.network.tls_cipher_negotiation_failure
  - hypothesis.network.tls_client_certificate_authentication_failure
common_misconceptions:
  - Every database connection failure is a network problem.
  - Application connection-pool exhaustion and PostgreSQL max_connections exhaustion are the same mechanism.
  - A responsive existing database session proves new sessions can still be admitted.
  - A transport reset is equivalent to a database protocol error returned over a healthy connection.
  - Connection refused, connection reset, connect timeout, DNS negative response, DNS timeout, certificate verification failure, TLS protocol mismatch, TLS cipher mismatch, and mTLS client-authentication failure describe the same connection lifecycle event.
search_terms:
  - database connection failed
  - postgres too many connections
