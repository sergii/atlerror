id: symptom.transaction.failed
kind: symptom
title: Transaction failed
summary: A database-backed operation or transaction did not commit successfully and returned or surfaced a failure.
explanation:
  short: A transaction failure is an outcome; the mechanism may be a deadlock, constraint violation, timeout, serialization failure, connection loss, or another database error.
  detailed: Diagnose the concrete database error and transaction state before assigning a cause. Deadlocks are one specific mechanism in which a cyclic lock dependency forces the database to abort a participant.
may_indicate:
  - hypothesis.database.deadlock
common_misconceptions:
  - Every transaction failure is a deadlock.
  - Retrying a failed transaction proves the underlying mechanism has been removed.
search_terms:
  - transaction failed
  - database transaction aborted
  - postgres 40P01
