id: symptom.external_dependency.request_failed
kind: symptom
title: External dependency request failed
summary: A downstream dependency request completed far enough to produce an application-protocol failure response instead of a successful result.
explanation:
  short: The dependency was reachable, but the downstream request failed at the application protocol or service layer.
  detailed: External dependency request failures should be separated from DNS, TCP, and TLS establishment failures. A reachable HTTP service can return a 5xx service error or an explicit policy response such as 429 Too Many Requests even when name resolution, transport connectivity, and HTTP exchange all succeed.
may_indicate:
  - hypothesis.external_dependency.service_error
  - hypothesis.external_dependency.rate_limiting
common_misconceptions:
  - A dependency returning HTTP 503 or 429 is the same as a TCP connection refusal; both HTTP statuses are application-protocol responses from a reachable service.
  - Every downstream failure is a timeout; explicit HTTP error responses provide different evidence and remediation paths.
  - Successful TCP connectivity proves the dependency operation succeeded; the service can still fail or intentionally reject the request after connection establishment.
  - HTTP 429 and HTTP 503 imply the same mechanism; rate limiting and service failure require different diagnosis and retry guidance.
search_terms:
  - downstream 503
  - downstream 429
  - external dependency 5xx
  - service unavailable dependency
  - rate limited dependency
  - upstream dependency error
