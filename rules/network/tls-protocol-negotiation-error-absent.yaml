id: rule.network.tls_protocol_negotiation_error.absent
hypothesis: hypothesis.network.tls_protocol_negotiation_failure
when:
  observation: observation.network.tls_protocol_negotiation_error
  operator: absent
effect:
  confidence: decrease
explanation: If a TLS handshake fails but there is no evidence of protocol-version negotiation failure, this mechanism becomes less likely and certificate, cipher, mTLS, or other handshake mechanisms should be considered.
