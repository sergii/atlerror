id: rule.network.packet_corruption.normal
hypothesis: hypothesis.network.packet_corruption
when:
  observation: observation.network.packet_corruption
  operator: not_above_baseline
effect:
  confidence: decrease
explanation: If integrity-aware probes match transmitted bytes and equivalent checksum or corruption telemetry does not rise above baseline, network packet corruption is a weaker explanation; packet loss, reordering, duplication, jitter, or higher-layer mechanisms should remain separate candidates.
