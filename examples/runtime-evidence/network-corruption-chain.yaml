    confidence: high
    source:
      type: metric
      name: linux.tcp.incsumerrors
      attributes:
        host: app-1
    scope:
      boundaries:
        - boundary.application.external_dependency
    measurement:
      value: 27
      baseline: 0
      delta: 27
      unit: segments
      comparison: above_baseline

