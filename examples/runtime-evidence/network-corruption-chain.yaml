schema_version: "0.1"
kind: runtime_evidence
incident_id: incident.network.retransmission_spike
description: Runtime observations from a network incident where retransmissions and TCP integrity errors rise together.
instances:
  - id: evidence.network.tcp_retransmissions.current
    observation: observation.network.tcp_retransmissions
    state: observed
    observed_at: "2026-09-11T14:46:00Z"
    expires_at: "2026-09-11T15:01:00Z"
    confidence: high
    source:
      type: metric
      name: linux.tcp.retranssegs
      attributes:
        host: app-1
    scope:
      entities:
        - system_entity.application_service
        - system_entity.external_dependency
      boundaries:
        - boundary.application.external_dependency
    measurement:
      value: 184
      baseline: 3
      delta: 181
      unit: segments
      comparison: above_baseline

  - id: evidence.network.tcp_integrity_errors.current
    observation: observation.network.tcp_integrity_errors
