version: 0.1

purpose: Orthogonal metadata for catalog mechanisms. The catalog provides a primary navigation tree; profiles provide cross-cutting facets and multi-dimensional coverage without changing canonical semantic identity.

principles:
  - Catalog placement is a primary navigation location, not an ontology is-a assertion.
  - Canonical semantic IDs remain the source of truth for relationships.
  - Facets may place one mechanism in several concerns, resources, or layers at once.
  - Coverage is multi-dimensional and MUST NOT be interpreted as a truth score.

facet_dimensions:
  domains: [resource_runtime, database, network, queue_messaging, external_dependency, application, infrastructure_os, filesystem_storage, security_identity]
  concerns: [performance, concurrency, transactions, locking, correctness, availability, capacity, reliability, delivery, isolation]
  resources: [cpu, memory, network, database, queue, filesystem, process]
  layers: [runtime, application, persistence, transport, operating_system, external_service, messaging]

coverage_dimensions:
  semantic: [none, partial, complete]
  predictions: [none, partial, complete]
  falsification: [none, partial, complete]
  probes: [none, partial, complete]
  rules: [none, partial, complete]
  human_explanation: [none, partial, complete]
  agent_action: [none, partial, complete]

profiles:
  - code: R1.1
    facets: {domains: [resource_runtime, application], concerns: [performance, capacity], resources: [cpu], layers: [application, runtime]}
    coverage: {semantic: complete, predictions: complete, falsification: complete, probes: complete, rules: complete, human_explanation: complete, agent_action: none}
    empirical: {synthetic_labs: 1, runtimes: [ruby], production_evidence: none}
