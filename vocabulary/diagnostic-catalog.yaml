version: 0.1

purpose: Human-oriented hierarchical aliases for navigating symptoms, fault mechanisms, semantic coverage, and empirical labs. Canonical semantic IDs remain the source of identity.

code_format:
  symptom: S<number>
  mechanism: <domain-prefix><family-number>.<topic-number>
  lab: <mechanism-code>-L<lab-number>

metadata_sources:
  facets_and_coverage: vocabulary/diagnostic-profiles.yaml
  code_history: vocabulary/diagnostic-code-history.yaml

stability:
  - Canonical semantic IDs remain authoritative and machine-stable.
  - Short catalog codes are navigation aliases and MUST NOT replace canonical IDs in semantic relationships.
  - Published short codes should not be reused for a different meaning.
  - If a topic is reclassified, prefer an alias/deprecation record rather than silently reusing its old code.

domains:
  - prefix: R
    title: Resource and runtime
    description: CPU, memory, runtime resource pressure, saturation, and process-level resource mechanisms.
  - prefix: D
    title: Database and persistence
    description: Query execution, locking, isolation, transactions, pooling, replication, and consistency.
  - prefix: N
    title: Network and transport
    description: Network latency, loss, resets, routing, DNS, TLS, and transport-level failures.
  - prefix: Q
    title: Queue and messaging
    description: Queueing delay, backlog, delivery semantics, consumers, retries, and asynchronous processing.
  - prefix: E
    title: External dependencies
    description: Downstream services, third-party APIs, quotas, throttling, and dependency availability.
  - prefix: A
    title: Application and logic
    description: Exceptions, crashes, correctness bugs, races, invalid state, and application-level failure mechanisms.
  - prefix: I
    title: Infrastructure and operating system
    description: Hosts, containers, orchestration, scheduler, kernel, deploy, configuration, and environment failures.
  - prefix: F
    title: Filesystem and storage
    description: Filesystem and block-storage latency, capacity, permissions, corruption, and persistence failures outside databases.
  - prefix: X
    title: Security and identity
    description: Authentication, authorization, credentials, certificates, policy, and security-control failures.

families:
  - code: R1
    title: CPU
    domain: R
  - code: R2
    title: Memory
    domain: R
  - code: D1
    title: Query execution
    domain: D
  - code: D2
    title: Locking, transactions, and isolation
    domain: D
  - code: D3
    title: Connections and pooling
    domain: D
  - code: D4
    title: Replication and consistency
    domain: D
  - code: N1
    title: Network latency and delivery
    domain: N
  - code: N2
    title: Connections and transport lifecycle
    domain: N
  - code: N3
    title: Name resolution and secure transport
    domain: N
  - code: Q1
    title: Queueing and backlog
    domain: Q
  - code: Q2
    title: Delivery semantics
    domain: Q
  - code: E1
    title: Dependency latency
    domain: E
  - code: E2
    title: Dependency availability and errors
    domain: E

