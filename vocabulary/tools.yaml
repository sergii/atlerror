version: 0.1

tools:
  - id: tool.opentelemetry
    title: OpenTelemetry
    provides: [capability.metrics.query]

  - id: tool.prometheus
    title: Prometheus
    provides: [capability.metrics.query]

  - id: tool.datadog
    title: Datadog
    provides: [capability.metrics.query]

  - id: tool.perf
    title: perf
    provides: [capability.cpu.profile, capability.cpu.mode_breakdown]

  - id: tool.rbspy
    title: rbspy
    provides: [capability.cpu.profile]

  - id: tool.runtime_metrics
    title: Runtime metrics
    provides: [capability.runtime.gc_metrics, capability.database.inspect_connection_pool]

  - id: tool.postgresql
    title: PostgreSQL
    provides: [capability.database.query_metrics, capability.database.inspect_locks, capability.database.inspect_errors, capability.database.inspect_state, capability.database.inspect_connections]

  - id: tool.socket_api
    title: Operating system socket API
    provides: [capability.network.inspect_connection_error]
