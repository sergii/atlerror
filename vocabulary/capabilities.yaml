version: 0.1

capabilities:
  - id: capability.metrics.query
    title: Query metrics
    description: Read time-series or aggregate metrics from an available telemetry source.
  - id: capability.cpu.profile
    title: Capture CPU profile
    description: Sample or trace CPU execution to identify hot code paths.
  - id: capability.runtime.gc_metrics
    title: Read runtime GC metrics
    description: Inspect runtime garbage collection and allocation telemetry.
  - id: capability.cpu.mode_breakdown
    title: Inspect user versus system CPU
    description: Read CPU accounting split between user-space and kernel/system work.
  - id: capability.http.measure_latency
    title: Measure HTTP latency
    description: Measure end-to-end or downstream HTTP request duration.
  - id: capability.http.inspect_response
    title: Inspect HTTP response outcome
    description: Perform or inspect an HTTP request and capture connection completion, response status, response metadata, and application-protocol error outcomes without conflating them with lower-layer transport failures.
  - id: capability.database.query_metrics
    title: Read database query latency
    description: Measure or retrieve database query timing and wait information.
  - id: capability.database.inspect_locks
    title: Inspect database locks
    description: Read lock ownership, blocked sessions, blockers, and lock-related wait metadata without changing database state.
  - id: capability.database.inspect_errors
    title: Inspect database errors
    description: Read database error codes, deadlock counters, logs, or client-visible database failures without changing database state.
  - id: capability.database.inspect_state
    title: Inspect database state
    description: Read database rows or aggregates needed to evaluate application consistency invariants without changing database state.
  - id: capability.database.inspect_connection_pool
    title: Inspect application database connection pool
    description: Read application-side database connection pool capacity, occupancy, checkout wait, timeout, and related runtime metrics without changing state.
  - id: capability.database.inspect_connections
    title: Inspect database connection admission and sessions
    description: Read database connection limits, active sessions, reserved admission policy, and connection-establishment errors without mutating application data.
  - id: capability.network.measure_latency
    title: Measure network transport latency
    description: Measure connection establishment or request exchange timing across a network boundary, separating transport-path delay from target-side processing when evidence permits.
  - id: capability.network.measure_jitter
    title: Measure network jitter
    description: Measure timing variation across repeated comparable network probes, including dispersion and tail spread, while tracking delivery and using an appropriate baseline.
  - id: capability.network.measure_packet_delivery
    title: Measure network packet delivery
    description: Send controlled probe units across a network boundary and compare sent versus successfully returned units to estimate delivery ratio and packet loss.
  - id: capability.network.measure_packet_order
    title: Measure network packet order
    description: Send uniquely sequenced probe units across a network boundary and compare send order with receive order while independently tracking missing and duplicate delivery.
  - id: capability.network.inspect_tcp_retransmissions
    title: Inspect TCP retransmissions
    description: Read transport-level TCP retransmission counters or equivalent connection telemetry around a controlled workload and compare them with an appropriate baseline.
  - id: capability.network.inspect_connection_error
    title: Inspect network connection error
    description: Attempt a controlled network connection and capture transport-layer establishment or teardown errors such as reset, refusal, timeout, and their OS/runtime error metadata.
  - id: capability.network.resolve_name
    title: Resolve network endpoint name
    description: Query DNS or the applicable resolver and capture positive answers, authoritative negative answers, resolver errors, and timing before transport establishment.
  - id: capability.network.inspect_tls_handshake
    title: Inspect TLS handshake and negotiation
    description: Attempt controlled TLS negotiation with normal verification and capture transport establishment, certificate verification errors, protocol or cipher negotiation errors, negotiated TLS metadata, and handshake outcome.
  - id: capability.queue.inspect
    title: Inspect queue waits
    description: Measure queueing delay, backlog, or time spent waiting before work begins.
  - id: capability.queue.inspect_delivery
    title: Inspect message delivery and acknowledgement history
    description: Read stable message identity, delivery attempts, pending or claimed state, acknowledgement metadata, consumer ownership, and related delivery evidence without mutating message state.
